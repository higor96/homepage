project:
  type: website
  output-dir: _site
  # Sem pre-render automático: publications/generate_person_bibliographies.py
  # e projects/generate_project_pages.py rodavam antes de TODO render — agora
  # só rodam quando chamados manualmente (`uv run publications/generate_person_bibliographies.py`
  # / `uv run projects/generate_project_pages.py`), quando os dados de
  # publicações/projetos mudarem de verdade.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!old/"
    - "!old_teaching/"
  # Por padrão, "quarto preview" pula o navegador pra aba/URL do
  # arquivo que acabou de renderizar a cada save — incômodo quando se
  # está editando um arquivo diferente do que está aberto no navegador.
  # navigate:false mantém o navegador exatamente onde está, só recarrega
  # o conteúdo (live reload continua funcionando normalmente).
  preview:
    navigate: false

execute:
  freeze: auto

# Filtro de diagramas (TikZ/Mermaid/Graphviz/...) via pandoc-ext/diagram,
# instalado em _extensions/pandoc-ext/diagram. Global porque só ativa em
# blocos de código com uma linguagem de diagrama (ex.: ```{.tikz}) — em
# páginas sem esse tipo de bloco, é inofensivo (não faz nada).
filters:
  - diagram
  - participants.lua
  - links.lua

diagram:
  cache: true
  engine:
    tikz:
      execpath: pdflatex
      # T1 (fontenc) é necessário pra acentos em português ("não", "ção"
      # etc.) dentro de nós do tikz — sem isso, o pdflatex usa a
      # codificação OT1 (sem esses caracteres) e o acento sai quebrado
      # (ex.: "não" virava "n˜ao", til separado da letra).
      additional-packages: |
        \usepackage[T1]{fontenc}
        \usepackage[utf8]{inputenc}
        \usepackage{lmodern}
        \usepackage{amsmath,amssymb}
        \usetikzlibrary{shapes.geometric, arrows.meta, positioning, calc}

website:
  title: "Marcos M. Raimundo"
  favicon: more.png
  navbar:
    right:
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "People"
        href: people/index.qmd
      - text: "Contact"
        href: contact.qmd
      - icon: github
        href: https://github.com/marcosmrai
      - icon: mortarboard-fill
        href: https://scholar.google.com.br/citations?user=ibe0jfQAAAAJ&hl=pt-BR
  page-footer:
    center: >-
      © 2026 Marcos M. Raimundo

format:
  html:
    theme: [flatly, custom.scss]
    css: styles.css
    toc: false
